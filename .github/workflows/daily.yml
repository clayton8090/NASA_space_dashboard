name: Daily data update

on:
  schedule:
    - cron: "15 6 * * *"   # every day at 06:15 UTC
  workflow_dispatch:       # also lets you run it by hand from the Actions tab
    inputs:
      backfill_days:
        description: "Also load this many past days (0 = none, max 365)"
        required: false
        default: "0"

permissions:
  contents: write          # needed so the job can commit the updated database

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests first
        run: python -m pytest -q

      - name: Backfill history (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_days != '0' && inputs.backfill_days != '' }}
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          SPACE_DB_PATH: data/space.db
          BACKFILL_DAYS: ${{ inputs.backfill_days }}   # passed as an env var, never pasted into the command
        run: python -m src.backfill --days "$BACKFILL_DAYS"

      - name: Fetch, clean and load data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          SPACE_DB_PATH: data/space.db
        run: python -m src.pipeline

      - name: Commit the updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/space.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update data $(date -u +%F)"
            git push
          fi
